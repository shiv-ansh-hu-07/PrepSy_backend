name: Build and Deploy to AWS

# Deploys on every push to main. Builds an ARM (arm64) image to match the
# t4g EC2 instance, pushes it to ECR, then tells the instance (via SSM, no
# SSH) to pull the new image and restart the container.
#
# Required GitHub repo configuration (Settings -> Secrets and variables -> Actions):
#   Variables:
#     AWS_REGION        e.g. ap-south-1
#     ECR_REPOSITORY    e.g. prepsy-backend
#     EC2_INSTANCE_ID   e.g. i-0abc123...
#   Secrets:
#     AWS_ROLE_ARN      arn:aws:iam::<account-id>:role/prepsy-deploy-role
#
# The AWS_ROLE_ARN role is assumed via GitHub OIDC — no long-lived AWS keys.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (for arm64 build on x86 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters commands='[
              "set -e",
              "cd /home/ec2-user/prepsy",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}",
              "docker compose pull",
              "docker compose run --rm app npx prisma migrate deploy",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Sent command $COMMAND_ID, waiting for completion..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          echo "----- SSM command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "----- StdErr -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
